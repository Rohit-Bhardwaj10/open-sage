version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16        # pgvector built-in for Phase 2
    container_name: open-sage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensage_secret}
      POSTGRES_DB: ${POSTGRES_DB:-opensage_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opensage} -d ${POSTGRES_DB:-opensage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (queue backbone) 
  redis:
    image: redis:7-alpine
    container_name: open-sage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # persist queue across restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  clones_data:     
