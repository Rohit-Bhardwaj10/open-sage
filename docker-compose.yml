version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: open-sage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensage_secret}
      POSTGRES_DB: ${POSTGRES_DB:-opensage_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opensage} -d ${POSTGRES_DB:-opensage_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
